name: PatchRover assessment
description: Run a deterministic, read-only PatchRover assessment against the checked-out repository.
author: PatchRover maintainers
branding:
  icon: shield
  color: green
inputs:
  pack:
    description: Bundled response-pack ID, such as php-2026-rce.
    required: true
  sbom:
    description: Optional workspace-relative CycloneDX or SPDX JSON path.
    required: false
  kube-snapshot:
    description: Optional workspace-relative approved Kubernetes PodList JSON path.
    required: false
  trail-output:
    description: Workspace-relative trail output path.
    required: false
    default: patchrover-trail.json
runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
      with:
        go-version-file: ${{ github.action_path }}/go.mod
        cache-dependency-path: ${{ github.action_path }}/go.mod
    - name: Assess repository
      shell: bash
      env:
        PATCHROVER_PACK: ${{ inputs.pack }}
        PATCHROVER_SBOM: ${{ inputs.sbom }}
        PATCHROVER_KUBE_SNAPSHOT: ${{ inputs.kube-snapshot }}
        PATCHROVER_TRAIL_OUTPUT: ${{ inputs.trail-output }}
      run: ${{ github.action_path }}/scripts/github-action.sh
